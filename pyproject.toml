[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guaro-backend"
version = "0.1.0"
description = "Guaro backend - FastAPI service"
readme = "guaro_backend/README.md"
requires-python = ">=3.10"
authors = [{ name = "Ruth Tirusew" }]

# Runtime dependencies
# Pulled from requirements.txt; test-only tools moved to [project.optional-dependencies].
dependencies = [
  "aiofiles==24.1.0",
  "annotated-types==0.7.0",
  "anyio==4.9.0",
  "async-property==0.2.2",
  "cached-property==1.5.2",
  "certifi==2025.7.14",
  "cffi==1.17.1",
  "charset-normalizer==3.4.2",
  "click==8.2.1",
  "cryptography==45.0.5",
  "deprecation==2.1.0",
  "dnspython==2.7.0",
  "docker==7.1.0",
  "ecdsa==0.19.1",
  "email_validator==2.2.0",
  "fastapi==0.116.1",
  "greenlet==3.2.3",
  "h11==0.16.0",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "idna==3.10",
  "jproperties==2.1.2",
  "jwcrypto==1.5.6",
  "packaging==25.0",
  "pyasn1==0.6.1",
  "pycparser==2.22",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "pydantic_core==2.33.2",
  "python-dotenv==1.1.1",
  "python-jose==3.5.0",
  "python-keycloak==5.6.0",
  "PyYAML==6.0.2",
  "requests==2.32.4",
  "requests-toolbelt==1.0.0",
  "rsa==4.9.1",
  "six==1.17.0",
  "sniffio==1.3.1",
  "SQLAlchemy==2.0.41",
  "starlette==0.47.2",
  "typing-inspection==0.4.1",
  "typing_extensions==4.14.1",
  "urllib3==2.8.0",
  "uvicorn==0.35.0",
  "wrapt==1.17.2",
]

[project.optional-dependencies]
# Development and testing tools
dev = [
  "pytest==8.4.1",
  "responses==0.25.6",
  "testcontainers==4.12.0",
  "pyfakefs==5.8.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [".*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100 