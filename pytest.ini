[tool:pytest]
testpaths = app

python_files = test_*.py *_test.py tests/*.py

python_functions = test_*

addopts = 
    --strict-markers
    --strict-config
    -ra

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s (%(filename)s:%(lineno)d)
log_cli_date_format = %Y-%m-%d %H:%M:%S

env = 
    TESTING=true